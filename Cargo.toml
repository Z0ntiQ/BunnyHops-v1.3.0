[package]
name = "bunny-hops-server"
version = "1.0.0"
edition = "2021"
description = "Hop Lite на Rust: 1:1 порт server.js + proxy-middleware.js (статика SPA + стриминговый прокси против CORS)."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tower-http = { version = "0.5", features = [] }
reqwest = { version = "0.12", features = ["stream", "gzip", "brotli", "deflate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
futures-util = "0.3"
percent-encoding = "2"
tokio-tungstenite = "0.24"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[profile.release]
strip = true
lto = true
